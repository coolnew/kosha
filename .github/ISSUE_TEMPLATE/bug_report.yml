name: Report a bug
description: Report a problem with Kosha's desktop app, CLI, installer or website.
body:
  - type: markdown
    attributes:
      value: |
        A short report is enough. Unknown details are fine; screenshots are optional.
        This report is public. Remove personal paths, names and secrets.
        For security vulnerabilities, use the private contact in [SECURITY.md](https://github.com/coolnew/kosha/security/policy).
  - type: input
    id: version
    attributes:
      label: Kosha version
      description: From Settings → Version or `kosha --version`, if available.
      placeholder: e.g. 0.10.7, website-only, or unknown
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other or unsure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Desktop app
        - Command line
        - Installation or upgrade
        - Website or documentation
        - Search recipes or marketplace
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: What did you do, what happened, and what did you expect? A few lines are enough.
      placeholder: "I clicked / ran …\nKosha did …\nI expected …"
    validations:
      required: true
  - type: checkboxes
    id: context
    attributes:
      label: Anything else that applies? (optional)
      options:
        - label: This happens every time I try.
        - label: I am viewing a saved snapshot or cached scan.
        - label: I am running as administrator or root.
        - label: This started after an upgrade.
  - type: textarea
    id: evidence
    attributes:
      label: Extra details (optional)
      description: Exact error, screenshot, OS version, chip, install method or command. Redact private information; do not upload complete scan indexes.
