name: Suggest a feature
description: Suggest an improvement to Kosha or its documentation.
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you are trying to achieve. Check existing issues if possible.
        This request will be public; leave out personal file paths and confidential data.
  - type: dropdown
    id: area
    attributes:
      label: Where would this help?
      multiple: true
      options:
        - Desktop app
        - Command line
        - Installation or upgrade
        - Website or documentation
        - Search recipes or marketplace
        - Other or unsure
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: A few lines about your task or difficulty are enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement (optional)
      description: An example helps, but you do not need to design the solution.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Optional workarounds, mockups or examples, with private information removed.
