name: Suggest a feature
description: Suggest an improvement to Kosha or its documentation.
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you are trying to achieve. Check existing issues if possible.
        This request will be public; leave out personal file paths and confidential data.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Explain the task or difficulty, and whether it concerns the GUI, CLI, installer or website.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: An example of the desired behavior is helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Optional workarounds, mockups or examples, with private information removed.
