# Public candidate validation and draft release. Manual runs only retain artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  public-source:
    name: Reviewed public source only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refuse private repository and internal source
        env:
          EXPECTED_REPOSITORY: coolnew/kosha
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          python - <<'PY'
          from pathlib import Path
          import runpy
          forbidden = ["publication", "CLAUDE.md", "AGENTS.md", ".agents", ".claude", ".codex", ".aws", ".env"]
          if any(Path(name).exists() for name in forbidden):
              raise SystemExit("Release refused: private instructions, credentials or export metadata present")
          runpy.run_path("xtask-package.py")["public_payloads"]()
          PY
      - name: Verify version and generated documentation
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python xtask-version.py --tag "$GITHUB_REF_NAME"
          else
            python xtask-version.py
          fi
          python xtask-llms.py --check

  build:
    name: ${{ matrix.target }}
    needs: public-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-x11-dev openssl libssl-dev \
            libzstd-dev libvulkan1 libgit2-dev libfontconfig1-dev libfreetype6-dev \
            pkg-config make cmake clang mold
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Verify host architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: >-
          python -c "import os,runpy; actual=runpy.run_path('xtask-package.py')['target_triple'](); assert actual == os.environ['EXPECTED_TARGET'], 'Runner architecture changed: ' + actual"
      - name: Validate, build, package, and smoke-test clean candidate
        if: runner.os == 'Linux'
        run: python xtask-release.py --execute --target-dir target --output-dir dist/candidate
      - name: Validate and package host binaries (shared sources are built on Linux)
        if: runner.os != 'Linux'
        run: python xtask-release.py --execute --binary-only --target-dir target --output-dir dist/candidate
      - name: Name host-specific release manifest
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python -c "import os,pathlib; p=pathlib.Path('dist/candidate'); (p/'release-manifest.json').rename(p/('release-manifest-'+os.environ['RELEASE_TARGET']+'.json'))"
      - uses: actions/upload-artifact@v6
        with:
          name: kosha-${{ matrix.target }}
          path: |
            dist/candidate/kosha-v*-${{ matrix.target }}.zip
            dist/candidate/kosha-v*-${{ matrix.target }}.tar.gz
            dist/candidate/kosha-v*-${{ matrix.target }}.dmg
            dist/candidate/kosha-v*-${{ matrix.target }}.zip.sha256
            dist/candidate/kosha-v*-${{ matrix.target }}.tar.gz.sha256
            dist/candidate/kosha-v*-${{ matrix.target }}.dmg.sha256
            dist/candidate/release-manifest-${{ matrix.target }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: kosha-source
          path: |
            dist/candidate/kosha-v*-source.zip
            dist/candidate/kosha-v*-source.tar.gz
            dist/candidate/kosha-v*-source.zip.sha256
            dist/candidate/kosha-v*-source.tar.gz.sha256
          if-no-files-found: error

  draft:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded archives and manifests
        run: |
          python3 - <<'PY'
          import os, runpy
          from pathlib import Path
          runpy.run_path("xtask-release.py")["verify_release_assets"](Path("artifacts"), os.environ["GITHUB_SHA"])
          PY
      - name: Classify release channel from the validated version
        id: channel
        run: |
          python3 - <<'PY'
          import os, runpy
          from pathlib import Path
          version = runpy.run_path("xtask-version.py")["validate"](Path.cwd(), os.environ["GITHUB_REF_NAME"])
          preview = runpy.run_path("xtask-release.py")["is_prerelease"](version)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prerelease={str(preview).lower()}\n")
          PY
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            Includes `kosha` (CLI), `kosha-gui` (desktop), source archives, offline
            manuals, SHA-256 sidecars, and a manifest for each host build.
            Both executables report their version, commit, and target with `--version`.

            Windows/macOS binaries are unsigned. Windows SmartScreen may warn;
            macOS is experimental and may require opening the app from its context menu.
            Linux desktop prerequisites and integration are described in `assets/README.md`.
            Review platform acceptance and downloaded hashes before publishing this draft.
