# Numbered previews publish after verified uploads; final releases stay drafts.
# Manual runs retain artifacts only, even when dispatched on a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  public-source:
    name: Reviewed public source only
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
      publish_preview: ${{ steps.channel.outputs.publish_preview }}
      msix_store: ${{ steps.channel.outputs.msix_store }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refuse private repository and internal source
        env:
          EXPECTED_REPOSITORY: coolnew/kosha
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          python - <<'PY'
          from pathlib import Path
          import runpy
          forbidden = ["publication", "CLAUDE.md", "AGENTS.md", ".agents", ".claude", ".codex", ".aws", ".env"]
          if any(Path(name).exists() for name in forbidden):
              raise SystemExit("Release refused: private instructions, credentials or export metadata present")
          runpy.run_path("xtask-package.py")["public_payloads"]()
          PY
      - name: Verify version and generated documentation
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python xtask-version.py --tag "$GITHUB_REF_NAME"
          else
            python xtask-version.py
          fi
          python xtask-llms.py --check
      - name: Classify numbered preview and effective Store packaging
        id: channel
        env:
          STORE_ENABLED: ${{ vars.KOSHA_MSIX_STORE_UPLOAD }}
        run: |
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          version = runpy.run_path("xtask-version.py")["validate"](Path.cwd())
          policy = runpy.run_path("xtask-release.py")["github_release_policy"](version)
          policy["msix_store"] = policy["msix_store"] and os.environ.get("STORE_ENABLED") == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("prerelease", "publish_preview", "msix_store"):
                  output.write(f"{key}={str(policy[key]).lower()}\n")
          PY
      - name: Preserve already-published releases
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, runpy
          runpy.run_path("xtask-release.py")["require_unpublished_release"](os.environ["GITHUB_REF_NAME"])
          PY

      - name: Require successful full CI for the exact tagged commit
        id: ci
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python xtask-ci-evidence.py --select target/approved-ci.json

      - name: Download reports from the approved CI run attempt
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: coolnew/kosha
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: ci-validation-*-${{ steps.ci.outputs.run_attempt }}
          path: target/validated-ci/reports

      - name: Verify native CI reports and bind release evidence
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python xtask-ci-evidence.py --collect target/approved-ci.json --reports target/validated-ci/reports --output target/validated-ci/ci-evidence.json

      - name: Retain approved validation evidence for release jobs
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: validated-ci
          path: target/validated-ci/
          overwrite: true
          retention-days: 14
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: public-source
    runs-on: ${{ matrix.os }}
    env:
      KOSHA_MSIX_STORE_UPLOAD: ${{ needs.public-source.outputs.msix_store }}
      KOSHA_MSIX_IDENTITY_NAME: ${{ vars.KOSHA_MSIX_IDENTITY_NAME }}
      KOSHA_MSIX_PUBLISHER: ${{ vars.KOSHA_MSIX_PUBLISHER }}
      KOSHA_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.KOSHA_MSIX_PUBLISHER_DISPLAY_NAME }}
      KOSHA_MSIX_AUTHOR_NAME: ${{ vars.KOSHA_MSIX_AUTHOR_NAME }}
      KOSHA_MSIX_SUPPORT_EMAIL: ${{ vars.KOSHA_MSIX_SUPPORT_EMAIL }}
      KOSHA_MSIX_WEBSITE: ${{ vars.KOSHA_MSIX_WEBSITE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-x11-dev openssl libssl-dev \
            libzstd-dev libvulkan1 libgit2-dev libfontconfig1-dev libfreetype6-dev \
            pkg-config make cmake clang mold
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Download verified CI evidence
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/download-artifact@v7
        with:
          name: validated-ci
          path: target/validated-ci
      - name: Verify host architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: >-
          python -c "import os,runpy; actual=runpy.run_path('xtask-package.py')['target_triple'](); assert actual == os.environ['EXPECTED_TARGET'], 'Runner architecture changed: ' + actual"
      - name: Install pinned portable NSIS compiler
        if: runner.os == 'Windows'
        run: python xtask-nsis.py --output-dir "${{ runner.temp }}/kosha-nsis" --execute
      - name: Validate, build, package, and smoke-test clean candidate
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python xtask-release.py --execute --target-dir target --output-dir dist/candidate ${{ github.event_name == 'push' && github.ref_type == 'tag' && '--ci-evidence target/validated-ci/ci-evidence.json' || '' }}
      - name: Validate and package host binaries (shared sources are built on Linux)
        if: runner.os == 'macOS' || (runner.os == 'Windows' && env.KOSHA_MSIX_STORE_UPLOAD != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python xtask-release.py --execute --binary-only --target-dir target --output-dir dist/candidate ${{ github.event_name == 'push' && github.ref_type == 'tag' && '--ci-evidence target/validated-ci/ci-evidence.json' || '' }}
      - name: Validate and package Windows ZIP plus Partner Center upload MSIX
        if: runner.os == 'Windows' && env.KOSHA_MSIX_STORE_UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python xtask-release.py --execute --binary-only --msix-store --target-dir target --output-dir dist/candidate ${{ github.event_name == 'push' && github.ref_type == 'tag' && '--ci-evidence target/validated-ci/ci-evidence.json' || '' }}
      - name: Smoke-test per-user Setup and PATH cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist/candidate/kosha-v*-x64-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one Setup EXE' }
          python scripts/test-windows-installer.py --setup $setup[0].FullName --execute
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Name host-specific release manifest
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python -c "import os,pathlib; p=pathlib.Path('dist/candidate'); (p/'release-manifest.json').rename(p/('release-manifest-'+os.environ['RELEASE_TARGET']+'.json'))"
      - uses: actions/upload-artifact@v6
        with:
          name: kosha-${{ matrix.target }}
          path: |
            dist/candidate/kosha-v*-${{ matrix.target }}.zip
            dist/candidate/kosha-v*-${{ matrix.target }}.tar.gz
            dist/candidate/kosha-v*-${{ matrix.target }}.dmg
            dist/candidate/kosha-v*-${{ matrix.target }}.zip.sha256
            dist/candidate/kosha-v*-${{ matrix.target }}.tar.gz.sha256
            dist/candidate/kosha-v*-${{ matrix.target }}.dmg.sha256
            dist/candidate/release-manifest-${{ matrix.target }}.json
            dist/candidate/kosha-v*-x64-store-upload.msix
            dist/candidate/kosha-v*-x64-store-upload.msix.sha256
            dist/candidate/msix-store-upload.json
            dist/candidate/kosha-v*-x64-setup.exe
            dist/candidate/kosha-v*-x64-setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: kosha-source
          path: |
            dist/candidate/kosha-v*-source.zip
            dist/candidate/kosha-v*-source.tar.gz
            dist/candidate/kosha-v*-source.zip.sha256
            dist/candidate/kosha-v*-source.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Assemble release and publish numbered preview
    needs: [public-source, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      KOSHA_MSIX_STORE_UPLOAD: ${{ needs.public-source.outputs.msix_store }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: target/release-artifacts
          pattern: kosha-*
          merge-multiple: true
      - name: Download CI approval for final recheck
        uses: actions/download-artifact@v7
        with:
          name: validated-ci
          path: target/validated-ci
      - name: Recheck CI approval before assembling release
        run: python xtask-ci-evidence.py --verify target/validated-ci/ci-evidence.json --manifests target/release-artifacts
      - name: Verify downloaded archives and manifests
        run: |
          python3 - <<'PY'
          import os, runpy
          from pathlib import Path
          runpy.run_path("xtask-release.py")["verify_release_assets"](Path("target/release-artifacts"), os.environ["GITHUB_SHA"], expect_msix=os.environ.get("KOSHA_MSIX_STORE_UPLOAD") == "true")
          PY
      - name: Recheck publication state before uploading
        run: |
          python3 - <<'PY'
          import os, runpy
          runpy.run_path("xtask-release.py")["require_unpublished_release"](os.environ["GITHUB_REF_NAME"])
          PY
      - name: Build release notes from the changelog section
        run: |
          python3 - <<'PY'
          import os, runpy, subprocess
          from pathlib import Path
          subprocess.run(["git", "fetch", "--tags", "--force", "--quiet", "origin"], check=True)
          runpy.run_path("xtask-release.py")["write_release_body"](Path("."), os.environ["GITHUB_REF_NAME"], Path("target/release-body.md"))
          PY
      - uses: softprops/action-gh-release@v3
        id: upload
        with:
          draft: true
          prerelease: ${{ needs.public-source.outputs.prerelease == 'true' }}
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: target/release-artifacts/*
          body_path: target/release-body.md
      - name: Verify uploaded inventory before publication
        env:
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          release = runpy.run_path("xtask-release.py")
          tag = os.environ["GITHUB_REF_NAME"]
          release["verify_uploaded_release"](Path("target/release-artifacts"), release["github_release"](tag, os.environ["RELEASE_ID"]), tag)
          PY
      - name: Publish numbered preview (keep regular releases as drafts)
        if: needs.public-source.outputs.publish_preview == 'true'
        env:
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false
      - name: Verify preview is publicly published
        if: needs.public-source.outputs.publish_preview == 'true'
        run: |
          python - <<'PY'
          import os, runpy
          info = runpy.run_path("xtask-release.py")["github_release"](os.environ["GITHUB_REF_NAME"])
          if info is None or info["draft"] or info.get("prerelease") is not True:
              raise SystemExit("Preview publication did not reach the expected state; inspect before retrying")
          print(info["html_url"])
          PY
