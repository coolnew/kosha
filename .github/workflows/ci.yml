name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

# PR ranges are cumulative; never cancel main code checks with a later docs push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      reference: ${{ steps.select.outputs.reference }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: select
        run: python xtask-ci.py

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # GPUI needs system libraries for Wayland, X11 and font handling.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-x11-dev openssl libssl-dev \
            libzstd-dev libvulkan1 libgit2-dev libfontconfig1-dev libfreetype6-dev \
            pkg-config make cmake clang mold

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Fail early on logic; the GUI is tested separately below, once.
      - name: Check core crates
        run: >
          cargo clippy --locked -p kosha-core -p kosha-analyze -p kosha-query -p kosha-search
          -p kosha-fsops -p kosha-cli --all-targets

      - name: Test core crates
        run: >
          cargo test --locked --workspace --exclude kosha-gui

      - name: Build everything
        run: cargo clippy --locked --workspace --all-targets

      - name: Test GUI
        run: cargo test --locked -p kosha-gui

      - name: Executable recipe authoring manual
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p kosha-cli
          python scripts/check-recipe-authoring-manual.py --cli target/debug/kosha

      - name: Record reusable native validation
        if: github.repository == 'coolnew/kosha' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python xtask-ci-evidence.py --native "${{ runner.temp }}/ci-validation/validation.json"

      - name: Upload native validation report
        if: github.repository == 'coolnew/kosha' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: ci-validation-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-validation/validation.json
          retention-days: 14
          if-no-files-found: error

  # A different libc, not a different kernel. `statvfs` field widths differ
  # between musl and glibc, and a numeric conversion that is a no-op on one can
  # truncate on the other — there was such a cast, and building natively on
  # three operating systems would never have found it, because all three of
  # them use glibc or Apple's libc.
  #
  # `cargo check` stops before Rust linking, but ring's build script still
  # compiles native C code and needs a musl C compiler.
  musl:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: musl (libc portability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - uses: Swatinem/rust-cache@v2

      - name: Check against musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: >
          cargo check --locked --target x86_64-unknown-linux-musl --all-targets
          -p kosha-core -p kosha-analyze -p kosha-query -p kosha-search
          -p kosha-fsops -p kosha-cli

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The sign-off check needs the pull request's base commit, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Public Markdown links
        run: python3 xtask-docs.py

      - name: Build public manual website
        run: |
          python3 -m pip install -r website/requirements.txt
          python3 xtask-website.py

      - name: Consistent versions
        run: |
          python3 xtask-version.py
          python3 -m unittest test_xtask_version

      - name: Generated LLM guide
        run: |
          python3 xtask-llms.py --check
          python3 -m unittest test_xtask_llms

      - name: Release and publication script tests
        run: python3 -m unittest discover -p 'test_*.py'

      # CONTRIBUTING.md says the DCO is enforced here. Until
      # this step existed they were describing something that did not happen,
      # and an unsigned commit would have merged with the build green.
      #
      # The base SHA goes through the environment rather than straight into the
      # shell: it is only ever a hash, but interpolating workflow context into
      # a command is a habit worth not having.
      - name: Sign-off (DCO)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            python3 xtask-dco.py "$BASE..HEAD"
          else
            python3 xtask-dco.py
          fi

      - name: SPDX headers
        run: python3 xtask-spdx.py --check

      # .gitattributes normalises to LF; this catches a file that slipped in
      # before the rule existed, or one committed with -c core.autocrlf=false.
      #
      # Done in Python rather than as a grep one-liner: grep builds differ in
      # how they treat a lone carriage return, and the obvious `grep $'\r$'`
      # can match every line or none depending on the shell. A check that
      # silently always passes is worse than no check.
      - name: Line endings
        run: python3 xtask-eol.py

      # A string broken across source lines keeps the next line's indentation
      # unless the break is escaped. The source reads correctly either way and
      # the window draws the gap, so the only way to see one is to open the
      # panel it is in and read it. Six were shipping when this was written.
      - name: Whitespace in drawn strings
        run: python3 xtask-gaps.py

      - name: Licenses present
        run: test -f LICENSE-MIT && test -f LICENSE-APACHE && test -f DCO

  reference:
    name: Executable manual references
    needs: changes
    if: needs.changes.outputs.reference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p kosha-query -p kosha-search
      - run: cargo build --locked -p kosha-cli
      - run: python scripts/check-recipe-authoring-manual.py --cli target/debug/kosha

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [changes, hygiene, test, musl, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python xtask-ci.py --gate
