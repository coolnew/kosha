name: Advisories

# Checks Cargo.lock against the RustSec advisory database. It is deliberately
# not part of the CI gate: a new advisory about an unchanged dependency should
# be visible and fixed, not silently block an unrelated change or release. The
# release security preflight reads the result before every release.
on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml", ".github/workflows/advisories.yml"]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml", ".github/workflows/advisories.yml"]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings
