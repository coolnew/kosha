name: Advisories

# Checks Cargo.lock against RustSec and the dependency policy. It is deliberately
# not part of the CI gate: a new advisory about an unchanged dependency should
# be visible and fixed, not silently block an unrelated change or release. The
# release security preflight reads the result before every release.
on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml", "deny.toml", ".github/workflows/advisories.yml"]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml", "deny.toml", ".github/workflows/advisories.yml"]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit Cargo.lock
        # Vulnerabilities always fail. Unsound advisories fail too. Unmaintained and
        # yanked crates are reported in the log but cannot be fixed by us when no
        # upgrade exists, so they do not turn the check red.
        run: cargo audit --deny unsound
  dependency-policy:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check locked licenses, bans and sources
        shell: bash
        run: |
          set -euo pipefail
          version=0.22.0
          asset="cargo-deny-${version}-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$asset.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$asset.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' 98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786 "$archive" \
            | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" "$asset/cargo-deny"
          "$RUNNER_TEMP/$asset/cargo-deny" --locked check bans licenses sources
