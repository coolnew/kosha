name: coverage

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    name: Select coverage
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.select.outputs.coverage }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: select
        run: python xtask-ci.py

  measure:
    name: Linux workspace coverage
    needs: changes
    if: needs.changes.outputs.coverage == 'true' && github.repository == 'coolnew/kosha'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only selected coverage jobs acquire this group. A docs-only push cannot
    # cancel the preceding code revision's instrumented run.
    concurrency:
      group: coverage-measure-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reviewed public checkout only
        run: |
          test ! -e publication/files.jsonl
          test ! -e CLAUDE.md
          test ! -e .env
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Linux GUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-x11-dev openssl libssl-dev \
            libzstd-dev libvulkan1 libgit2-dev libfontconfig1-dev libfreetype6-dev \
            pkg-config make cmake clang mold
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-coverage
          workspaces: ". -> target/coverage-build"
      - name: Instrument and test once
        env:
          CARGO_TARGET_DIR: target/coverage-build
        run: cargo llvm-cov --locked --workspace --no-report
      - name: Export HTML, LCOV and measured totals
        env:
          CARGO_TARGET_DIR: target/coverage-build
        run: |
          cargo llvm-cov report --html --output-dir target/coverage/site/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --json --summary-only --output-path target/coverage/llvm-summary.json
          python xtask-coverage.py --input target/coverage/llvm-summary.json --output target/coverage/site --platform linux --scope workspace
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-linux-${{ github.sha }}
          path: |
            target/coverage/site/
            target/coverage/lcov.info
            target/coverage/llvm-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare optional Pages artifact
        if: vars.KOSHA_COVERAGE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/coverage/site

  pages:
    name: Publish coverage Pages
    needs: measure
    if: vars.KOSHA_COVERAGE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    steps:
      # Configure Pages in repository settings first. This does not enable it
      # or change repository visibility, custom domains, or access settings.
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - id: deploy
        uses: actions/deploy-pages@v5
