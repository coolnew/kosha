name: coverage

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    name: Select coverage
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.select.outputs.coverage }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: select
        run: python xtask-ci.py

  measure:
    name: Workspace coverage (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.coverage == 'true' && github.repository == 'coolnew/kosha'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, runner: ubuntu-latest}
          - {platform: windows, runner: windows-latest}
          - {platform: macos, runner: macos-latest}
    timeout-minutes: 60
    # Only selected coverage jobs acquire this group. A docs-only push cannot
    # cancel the preceding code revision's instrumented run.
    concurrency:
      group: coverage-measure-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reviewed public checkout only
        shell: bash
        run: |
          test ! -e publication/files.jsonl
          test ! -e CLAUDE.md
          test ! -e .env
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Linux GUI build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-x11-dev openssl libssl-dev \
            libzstd-dev libvulkan1 libgit2-dev libfontconfig1-dev libfreetype6-dev \
            pkg-config make cmake clang mold
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-coverage
          workspaces: ". -> target/coverage-build"
      - name: Instrument and test once
        shell: bash
        env:
          CARGO_TARGET_DIR: target/coverage-build
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "target/coverage/raw/$PLATFORM"
          features=()
          if [ "$PLATFORM" = windows ]; then
            features=(--features kosha-cli/fast-ntfs-worker,kosha-gui/fast-ntfs-worker)
          fi
          cargo llvm-cov --locked --workspace "${features[@]}" --no-report -- --format pretty --color never 2>&1 |
            tee "target/coverage/raw/$PLATFORM/tests.log"
      - name: Export source and scenario coverage
        shell: bash
        env:
          CARGO_TARGET_DIR: target/coverage-build
          PLATFORM: ${{ matrix.platform }}
        run: |
          raw="target/coverage/raw/$PLATFORM"
          site="target/coverage/site/$PLATFORM"
          cargo llvm-cov report --html --output-dir "$site/coverage"
          cargo llvm-cov report --lcov --output-path "$raw/lcov.info"
          cargo llvm-cov report --json --summary-only --output-path "$raw/llvm-summary.json"
          python xtask-coverage.py --input "$raw/llvm-summary.json" --output "$site" --platform "$PLATFORM" --scope workspace
          python xtask-coverage.py --scenarios --input "$raw/lcov.info" --test-log "$raw/tests.log" --output "$site" --platform "$PLATFORM" --scope workspace
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-native-${{ matrix.platform }}-${{ github.sha }}
          path: |
            target/coverage/site/
            target/coverage/raw/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  bundle:
    name: Bundle native reports for Pages
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-native-*-${{ github.sha }}
          path: target/coverage
          merge-multiple: true
      - name: Require source and scenario reports for every platform
        run: |
          for platform in linux windows macos; do
            test -f "target/coverage/site/$platform/summary.json"
            test -f "target/coverage/site/$platform/scenarios.json"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-platforms-${{ github.sha }}
          path: target/coverage/site/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
