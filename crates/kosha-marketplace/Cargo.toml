[package]
name = "kosha-marketplace"
description = "Shared storage and lifecycle for Kosha marketplace packages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kosha-core.workspace = true
kosha-search.workspace = true
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
