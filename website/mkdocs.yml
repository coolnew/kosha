site_name: Kosha
site_description: Understand your disk. Find what matters. Reclaim space with confidence.
site_url: https://coolnew.github.io/kosha/
repo_url: https://github.com/coolnew/kosha
repo_name: GitHub
edit_uri: ''
docs_dir: ../target/website/docs
site_dir: ../target/website/site
use_directory_urls: true
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
  navigation_depth: 3
extra_css: [styles/site.css]
plugins: [search]
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Get started:
      - Installation: manual/getting-started.md
      - Desktop tour: manual/desktop-tour.md
      - Command line: manual/command-line.md
      - Linux: manual/linux.md
  - User manual:
      - Contents: manual/index.md
      - Scanning: manual/scanning.md
      - Search and findings: manual/results-and-search.md
      - Snapshots and comparisons: manual/snapshots.md
      - Safe cleanup: manual/safety.md
      - Settings and privacy: manual/settings-and-files.md
      - Keyboard controls: manual/keyboard.md
      - Troubleshooting: manual/troubleshooting.md
  - Search recipes:
      - Custom recipes: manual/search-recipes.md
      - Query language: manual/query-language.md
      - Marketplace: manual/marketplace.md
      - Author recipe packs: manual/recipe-authoring.md
  - Quality:
      - Tests and scope: manual/quality-and-coverage.md
      - Performance reference: manual/performance.md
      - Coverage report: https://coolnew.github.io/kosha/coverage/
  - Download: https://github.com/coolnew/kosha/releases
validation:
  links:
    not_found: warn
    unrecognized_links: warn
